<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bookings</title>
</head>
<body>

<h1>Hotels</h1>
<div class="container">
    {% for hotel in hotels %}
        <div class="hotel">
            <div class="hotel__image">
                <img src="{{ url_for('static', path='images/' + hotel.image_id|string + '.webp') }}"
                     alt="Фото">
            </div>
            <div class="hotel__info">
                <h3>{{ hotel.name }} - {{ hotel.location }}</h3>
            </div>
        </div>
    {% endfor %}
</div>

</body>
<style>

    .container {

    }

    .hotel {
        display: flex;
        justify-content: center;
    }

    .hotel__info {
        padding-left: 20px;
    }

    .hotel__image img {
        width: 300px;
        height: 200px;
    }
</style>
</html>
